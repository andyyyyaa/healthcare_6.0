<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="医智评估 - 医疗健康诊断平台">
        <meta name="keywords" content="healthcare, diagnosis, AI, medical">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <title data-title-zh="医智评估 - 登录/注册" data-title-en="ClinRisk - Login / Sign Up">医智评估</title>
    </head>
    <body class="bg-light">
        <div class="position-fixed top-0 end-0 p-3" style="z-index: 1200;">
            <button class="btn btn-outline-secondary btn-sm" type="button" onclick="toggleLang()">
                <i class="bi bi-translate me-1"></i><span class="lang-zh">English</span><span class="lang-en">中文</span>
            </button>
        </div>
        <main>
            {% block content %}
            {% endblock content %}
            
            <!-- 导航栏 -->
            <nav class="fixed-bottom">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body p-3">
                                    <div class="row g-2 text-center">
                                        <div class="col-6 col-md-3">
                                            <a href='{{ url_for("search") }}' class="btn btn-outline-success btn-sm w-100">
                                                <i class="bi bi-search d-block"></i>
                                                <small><span class="lang-zh">骨折查询</span><span class="lang-en">Fracture Search</span></small>
                                            </a>
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <a href='{{ url_for("search_heart") }}' class="btn btn-outline-success btn-sm w-100">
                                                <i class="bi bi-heart-pulse d-block"></i>
                                                <small><span class="lang-zh">心脏病查询</span><span class="lang-en">Heart Search</span></small>
                                            </a>
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <a href='{{ url_for("diagnosis") }}' class="btn btn-outline-primary btn-sm w-100">
                                                <i class="bi bi-x-ray d-block"></i>
                                                <small><span class="lang-zh">骨折诊断</span><span class="lang-en">Fracture Dx</span></small>
                                            </a>
                                        </div>
                                        <div class="col-6 col-md-3">
                                            <a href='{{ url_for("heart_disease_prediction") }}' class="btn btn-outline-danger btn-sm w-100">
                                                <i class="bi bi-heart-fill d-block"></i>
                                                <small><span class="lang-zh">心脏诊断</span><span class="lang-en">Heart Dx</span></small>
                                            </a>
                                        </div>
                                    </div>
                                    <div class="text-center mt-2">
                                        <a href='{{ url_for("home") }}' class="btn btn-outline-secondary btn-sm">
                                            <i class="bi bi-house-fill me-1"></i><span class="lang-zh">返回主页</span><span class="lang-en">Back to Home</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </main>
        
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{{ url_for('static', filename='lang.js') }}"></script>
    </body>
</html>
